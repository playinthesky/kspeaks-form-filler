$schema: ./schemas/master.schema.yaml
schema_version: "0.1.0"

project:
  id: example-form-filler
  name: Example Form Filler
  owner: Example Organization
  status: phase-1-skeleton

runtime:
  python: ">=3.10"

parser:
  selected: python_hwpx
  fallback: kordoc
  decision_status: provisional_until_real_templates

paths:
  typography: typography.yaml
  templates_root: templates/forms
  output_root: outputs

company:
  legal_name_ko: Example Company
  legal_name_en: Example Organization
  display_name: Example Organization

output_plan:
  phase_1:
    formats:
      - hwpx
    pdf_preview: excluded
  phase_2_3:
    pdf_preview: review_later

data_plan:
  phase_1:
    source: master.yaml
    purpose: static_company_info
    status: active
  phase_2:
    source: form_fixtures
    purpose: test_data
    formats:
      - yaml
      - json
    status: planned
  phase_4:
    source: google_sheets
    purpose:
      - settlement
      - deliverables
      - staff_info
    status: planned
  rejected:
    - source: csv
      reason: Google Sheets is the higher-level operational source.
    - source: database
      reason: Too heavy for the current form-filling scope.

validation:
  fail_on_missing_required: true
  flag_unmatched_slots: true
  preserve_original_layout: true
  require_hwpx_roundtrip_check: true

forms:
  - id: project_proposal
    title: Project proposal
    typography_profile: default_160
    template:
      source:
        canonical_filename: source.hwpx
        path: templates/forms/project_proposal/source.hwpx
        storage: private_data_repo
        allowed_locations:
          - kspeaks-form-data
        commit_to_public_git: false
      skeleton_hwpx: templates/forms/project_proposal/skeleton/skeleton.hwpx
      manifest: templates/forms/project_proposal/manifest.yaml
      mapping: templates/forms/project_proposal/mapping.json
      commit_to_public_git:
        skeleton_hwpx: true
        mapping: true
    required_fields:
      - project_name
      - client_name
      - proposal_date
  - id: service_contract
    title: Service contract
    typography_profile: default_160
    template:
      source:
        canonical_filename: source.hwpx
